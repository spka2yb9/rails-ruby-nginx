<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railsエンジニアのためのサーバ運用 | Railsアプリの仕組みと設計・運用</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/lesson.css">
<!-- 教科書の第6部として埋め込まれたとき（?embed）。教科書の上部バーと目次が外側にある -->
<script>if (location.search.indexOf('embed') >= 0) document.documentElement.classList.add('embed');</script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../">Railsアプリの仕組みと設計・運用</a>
  <label class="exercise-picker" for="exercise-select">演習を選ぶ
    <select id="exercise-select"></select>
  </label>
  <div class="top-actions">
    <button class="top-btn" id="btn-concepts">用語集</button>
    <button class="top-btn" id="btn-sheet">コマンド早見表</button>
  </div>
</header>

<main class="main" id="case-view">
  <div id="case-head"></div>
  <div id="case-work">
    <div class="case-left" id="case-left"></div>
    <div class="case-right">
      <div class="term-wrap">
        <div class="term-head">
          <span class="term-title"><span aria-hidden="true">›_</span> 練習用ターミナル</span>
          <span class="term-note" role="status">ブラウザ内で実行</span>
        </div>
        <div id="term"></div>
        <div class="term-foot">
          <button id="term-enter">実行 <kbd>Enter</kbd></button>
          <button id="term-cancel">中断 <kbd>Ctrl+C</kbd></button>
        </div>
      </div>
    </div>
    <div id="case-resources"></div>
    <section id="case-quiz" aria-label="回答と解説"></section>
  </div>
  <footer class="progress-foot">
    <span id="course-progress"></span>
    <button class="text-btn" id="reset-progress" hidden>学習記録をリセット</button>
  </footer>
</main>

<dialog class="overlay" id="overlay" aria-labelledby="reference-title">
  <div class="overlay-box">
    <button class="ov-close" id="overlay-close" aria-label="閉じる">✕</button>
    <div id="overlay-body"></div>
  </div>
</dialog>

<!-- ライブラリ（すべてローカル。CDNもサーバーも使わない） -->
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="vendor/lifo.min.js"></script>
